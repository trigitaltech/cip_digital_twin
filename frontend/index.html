<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CIP/CIL Metallurgical Digital Twin | React Native Telemetry</title>
    <meta name="description" content="Gold CIP & CIL Digital Twin React Native operations console for slurry telemetry, carbon adsorption optimization, and reagent dosing." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Ensure full-height viewport for React Native flexbox layout */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #080C16;
        color: #F1F5F9;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        overflow-y: auto;
      }
      #root {
        min-height: 100%;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      * {
        box-sizing: border-box;
      }

      /* Universally visible, prominent Gold Mine SCADA scrollbars */
      * {
        scrollbar-width: thin;
        scrollbar-color: #F59E0B #080E1B;
      }

      /* Webkit Browsers (Chrome, Edge, Safari, Opera, Brave) */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #080E1B;
        border-left: 1px solid #1E293B;
      }
      ::-webkit-scrollbar-track:horizontal {
        border-left: none;
        border-top: 1px solid #1E293B;
      }
      ::-webkit-scrollbar-thumb {
        background: #253552;
        border-radius: 5px;
        border: 2px solid #080E1B;
        transition: background 0.15s ease-in-out, border-color 0.15s ease-in-out;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #F59E0B;
        border-color: #78350F;
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
      }
      ::-webkit-scrollbar-thumb:active {
        background: #FBBF24;
        border-color: #B45309;
        box-shadow: 0 0 14px rgba(251, 191, 36, 0.8);
      }
      ::-webkit-scrollbar-corner {
        background: #080E1B;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
